[project]
name = "coeficiente-de-mcadams-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# packages/core/tests está para que las pruebas del núcleo importen su módulo
# auxiliar como "from reference_pipeline import ...". Un import relativo no
# sirve: packages/core/tests y packages/app/tests se importan ambos como el
# paquete "tests" y, en la suite completa, "tests" queda apuntando al de app.
pythonpath =["scripts", "packages/core/src", "packages/core/tests"]